<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>What if you never had to sleep? (long-form)</title>
<link rel="stylesheet" href="../../whatif/lib/stage.css">
</head>
<body>
<div id="stage"></div>
<script src="../../whatif/lib/stage.js"></script>
<script src="../../whatif/lib/kit.js"></script>
<script src="../../whatif/lib/sets/kitchen.js"></script>

<script src="../../whatif/lib/sets/classroom.js"></script>
<script src="../../whatif/lib/sets/street.js"></script>
<script src="vo.js"></script>
<script>K.loc.hospital = K.loc.hospital || ((w, o) => { const L = w.layer(1); PT.svg("rect", {x:-300,y:-400,width:2520,height:1700,fill:"#9fc7c0"}, w.layer(0.5)); const p = PT.puppet(L, {shirt:"#e4572e"}); return { people: [{ p }], anchors: { chair: { x: 900, y: 930 } }, beats: () => [], update(t, st) { (st.cast||[]).forEach((c) => p.pose(Object.assign({x:900,y:930,s:1.3}, c))); } }; });</script>
<script>
/* What if you never had to sleep? 16:9 long-form. Every beat is keyed to a {#tag} in narration.txt. */
const { lerp, clamp, seg, ease, spring, svg, html } = PT;
K.init({ format: "long" });
const V = K.vo, G = (k) => V.tag(k), GE = (k) => V.tagEnd(k), GW = (k, w) => V.tagWord(k, w);
const T = { end: GE("cta") + 2.2 };

/* ---------------------------------------------------------------- you, over a lifetime */
const AGE_KEYS = [["title", 0], ["age5", 5], ["age10", 10], ["age16", 16], ["age30", 30], ["age32", 32], ["son", 36],
  ["age50", 50], ["shoulder", 58], ["grow", 70], ["age75", 75], ["grand", 78], ["follow", 80]].map(([k, v]) => [G(k), v]);
const ageAt = (t) => {
  let i = -1;
  while (i + 1 < AGE_KEYS.length && t >= AGE_KEYS[i + 1][0]) i++;
  if (i < 0) return 0;
  const [a, v] = AGE_KEYS[i], prev = i ? AGE_KEYS[i - 1][1] : v, next = i + 1 < AGE_KEYS.length ? AGE_KEYS[i + 1][0] : a + 2;
  return lerp(prev, v, ease.inOutSine(seg(t, a, a + Math.min(next - a, 2.0))));
};
const YOU = { shirt: "#e4572e", hair: "#3a2a22", hairStyle: "curly" };
const hairFor = (age) => (age < 55 ? ["curly", "#3a2a22"] : age < 70 ? ["curly", "#8f8a84"] : ["thin", "#e9e4da"]);
const bodyFor = (age, adult = 1.4) => age < 12 ? { s: lerp(0.55, 0.86, clamp((age - 4) / 7)) * adult / 1.4, hs: lerp(1.42, 1.25, clamp((age - 4) / 7)) }
  : age < 18 ? { s: lerp(0.86, 1.36, clamp((age - 11) / 6)) * adult / 1.4, hs: lerp(1.25, 1.04, clamp((age - 11) / 6)) }
  : { s: adult, hs: 1, lean: clamp((age - 62) / 18) * 7 };
const youPuppets = [];
const trackYou = (p) => { youPuppets.push({ p, hair: "" }); return p; };
const updateHair = (age) => { const [st, c] = hairFor(age), key = st + c; youPuppets.forEach((y) => { if (y.hair !== key) { y.p.setHair(st, c); y.hair = key; } }); };

/* ---------------------------------------------------------------- worlds */
const MOM = { shirt: "#5aa9e6", hair: "#2a1f1d", hairStyle: "bun" }, DAD = { shirt: "#7b4b94", hair: "#2a1f1d", hairStyle: "short" };
const NOOR = { shirt: "#2a9d8f", hair: "#1c1f2e", hairStyle: "bob" };

// 1. the night you're born: Mom sings by the crib, then falls asleep in the chair
const wBirth = K.world(K.stage);
const birth = K.loc.bedroom(wBirth, { you: MOM, sleeper: { hair: "#2a1f1d", style: "short" } });
const birthChair = K.prop.chair(wBirth.layerBehind(birth.you.root), { x: 1010, y: 912, s: 1.42 });
const birthProps = wBirth.layer(1.05);
const crib = K.prop.crib(birthProps, { x: 700, y: 905, hair: "#3a2a22" });
const birthNotes = K.prop.notes(birthProps, { x: 930, y: 420 });

// 2. age five, awake in bed: eleven hours of ceiling
const wChild = K.world(K.stage);
const child = K.loc.bedroom(wChild, { sleeper: { hair: "#3a2a22", style: "curly", s: 0.82 } });

// 3. the kitchen at night: age five with Dad, age fifty with Mom
const wKit = K.world(K.stage);
const kit = K.loc.kitchen(wKit, { cast: [
  { ...YOU, x: 0, s: 0.75, hs: 1.4 },     // 0: you, age 5, seated
  { ...DAD, x: 0 },                      // 1: Dad
  { ...YOU, x: 0 },                      // 2: you, age 50
  { ...MOM, x: 0, glasses: true },       // 3: Mom, 75
] });
const [kYouKid, kDad, kYou, kMom] = kit.people.map((q) => q.p);
trackYou(kYou);
const seats = kit.anchors.seats;
// the set's seats assume a scale-1 sitter; a sitting puppet's hips sit 64 * s above its feet, so feet go at seatTop + 64 * s
const seatY = (i, s) => seats[i].y - 64 + 64 * s;

// 4. age ten, the classroom
const wClass = K.world(K.stage);
const cls = K.loc.classroom(wClass, { cast: [
  { shirt: "#f2b134", hair: "#6b3d24", hairStyle: "bob" },
  { ...YOU },
  { shirt: "#7b4b94", hair: "#1c1f2e", hairStyle: "short" },
  { shirt: "#2a9d8f", hair: "#2a1f1d", hairStyle: "bun", glasses: true },   // the teacher
] });

// 5. the street at night: the diner at sixteen; meeting Noor at thirty-two
const wSt = K.world(K.stage);
const st = K.loc.street(wSt, { cast: [{ ...YOU }, { ...NOOR }] });
const [sYou, sNoor] = st.people.map((q) => q.p);
trackYou(sYou);

// 6. married at sunrise
const wPark = K.world(K.stage);
const park = K.loc.park(wPark, { cast: [{ ...YOU, x: 1150 }, { ...NOOR, x: 1300 }] });
trackYou(park.people[0].p);
const parkProps = wPark.layer(1.0);
const bunting = svg("g", { filter: "url(#lift)" }, parkProps);
for (let i = 0; i < 11; i++) svg("path", { d: `M ${960 + i * 62} ${430 + 18 * Math.sin(i / 10 * Math.PI)} l 26 46 l 26 -46 Z`, fill: ["#e4572e", "#f2b134", "#2a9d8f", "#f6ecd9"][i % 4] }, bunting);
svg("path", { d: "M 960 430 Q 1270 470 1580 430", stroke: "#cdbf9f", "stroke-width": 2, fill: "none" }, parkProps);

// 7. the family bedroom: your son in the crib, Noor asleep, you awake
const wHome = K.world(K.stage);
const home = K.loc.bedroom(wHome, { you: YOU, sleeper: { hair: "#1c1f2e", style: "bob" } });
trackYou(home.you);
const homeProps = wHome.layer(1.05);
const sonCrib = K.prop.crib(homeProps, { x: 640, y: 905, hair: "#3a2a22" });

// 8. the hospital, age seventy-five
const wHosp = K.world(K.stage);
const hosp = K.loc.hospital(wHosp, { patient: { hair: "#e9e4da", hairStyle: "bob", color: "#2a9d8f" }, cast: [{ ...YOU }] });
const hYou = hosp.people[0].p;
trackYou(hYou);

// 9. your granddaughter won't close her eyes
const wGrand = K.world(K.stage);
const grand = K.loc.bedroom(wGrand, { you: YOU, sleeper: { hair: "#6b3d24", style: "bob", s: 0.8 } });
trackYou(grand.you);
const grandNotes = K.prop.notes(wGrand.layer(1.05), { x: 1100, y: 430 });

/* ---------------------------------------------------------------- riso pages */
const HEAD = "What if you never had to sleep?";
// R1: ten extra years
const r1 = K.riso.page(K.stage, { header: HEAD + "  ·  the extra hours", page: "1" });
const r1Big = K.riso.bignum(r1.inner, { x: 180, y: 170, size: 260, digits: 5, commas: true });
const r1Unit = K.riso.text(r1.inner, "extra hours by 30", { x: 190, y: 450, w: 900, size: 64, cls: "risoT blue" });
const r1Eq = K.riso.text(r1.inner, "30 years × 365 nights × 8 hours", { x: 192, y: 560, w: 900, size: 30, cls: "riso-label" });
const r1Ten = K.riso.text(r1.inner, "= <em>ten extra years.</em>", { x: 190, y: 620, w: 900, size: 92, cls: "risoT blue" });
const r1List = ["4 languages", "every classic", "a lot of chess"].map((s, i) =>
  K.riso.text(r1.inner, "✓ " + s, { x: 1180, y: 300 + i * 120, w: 640, size: 54, cls: "riso-body" }));
// R2: the napkin
const r2 = K.riso.page(K.stage, { header: HEAD + "  ·  the napkin", page: "2" });
const r2T = K.riso.title(r2.inner, ["The napkin math"], { x: 150, y: 110, size: 96 });
const r2Sub = K.riso.text(r2.inner, "Years spent awake. You never sleep; Mom, 25 years older, sleeps a third of hers.", { x: 154, y: 240, w: 1600, size: 34 });
const napkin = K.riso.lines(r2.inner, { x: 260, y: 360, w: 1180, h: 520, xMax: 80, yMax: 80, xLabel: "your age",
  xTicks: [0, 10, 20, 30, 40, 50, 60, 70, 80], yTicks: [0, 20, 40, 60, 80],
  series: [{ label: "YOU", color: "blue", f: (x) => x }, { label: "MOM", color: "pink", f: (x) => Math.min(80, (x + 25) * 2 / 3) }] });
const r2Ring = svg("circle", { cx: 260 + (50 / 80) * 1180, cy: 360 + 520 - (50 / 80) * 520, r: 44, fill: "none", stroke: "#ff48b0", "stroke-width": 7, class: "mul", opacity: 0 },
  svg("svg", { width: 1920, height: 1080, viewBox: "0 0 1920 1080", style: "position:absolute;inset:0" }, r2.inner));
const r2At = K.riso.text(r2.inner, "at 50: <em>even</em>", { x: 1040, y: 470, w: 500, size: 54, cls: "risoT blue" });
// R3: nobody can live without sleep
const r3 = K.riso.page(K.stage, { header: HEAD + "  ·  what's real", page: "3" });
const r3T = K.riso.title(r3.inner, ["Nobody can live", "without sleep."], { x: 150, y: 110, size: 104 });
const r3Big = K.riso.bignum(r3.inner, { x: 150, y: 420, size: 240, digits: 3, unit: "hours", unitSize: 110 });
const r3Note = K.riso.text(r3.inner, "Randy Gardner, 17: 264 hours (11 days) awake over New Year's 1964. Hallucinations began around day four.", { x: 160, y: 690, w: 900, size: 40 });
const r3Rats = K.riso.text(r3.inner, "Lab rats kept awake: <em>dead or dying in 11–32 days.</em>", { x: 1160, y: 470, w: 640, size: 64, cls: "risoT blue" });
// R4: but some people are built for less
const r4 = K.riso.page(K.stage, { header: HEAD + "  ·  what's real", page: "4" });
const r4T = K.riso.title(r4.inner, ["Some people are", "built for less."], { x: 150, y: 110, size: 104 });
const r4Helix = K.riso.helix(r4.inner, { x0: 150, x1: 980, cy: 600, hi: 13 });
const r4Bars = K.riso.bars(r4.inner, { x: 1150, y: 520, unit: 72, max: 8, gap: 130, h: 70, title: "Hours of sleep a night",
  rows: [{ label: "Most adults", value: 8, text: "8 h" }, { label: "DEC2 carriers", value: 6.25, text: "6¼ h", color: "pink" }] });
const r4Animals = K.riso.text(r4.inner, "Dolphins sleep one half of the brain at a time. Frigatebirds nap in flight.", { x: 1150, y: 860, w: 700, size: 34 });
const r4Fine = K.riso.text(r4.inner, "DEC2: one family, 6¼ h vs 8 h a night (He et al., 2009). A 2022 study of 191,929 people did not find the effect more widely.", { x: 154, y: 930, w: 880, size: 22, cls: "riso-body" });
// R5: would you?
const r5 = K.riso.page(K.stage, { header: HEAD, page: "5" });
const r5Big = K.riso.bignum(r5.inner, { x: 150, y: 160, size: 330, digits: 2, unit: "years", unitSize: 140 });
const r5Sub = K.riso.text(r5.inner, "and 8 months, awake while everyone else sleeps.", { x: 160, y: 520, w: 820, size: 48 });
const r5Grid = K.riso.grid(r5.inner, { x: 1120, y: 150, size: 54, gap: 12, fill: 80 / 3, label: "1 square = 1 year of your life" });
const r5Ask = K.riso.text(r5.inner, "Would you <em>take them?</em>", { x: 150, y: 700, w: 900, size: 112, cls: "risoT blue" });

/* ---------------------------------------------------------------- HUD: title, tickets, captions */
const hud = K.hud();
const banner = K.banner(hud, ["What if you", "*never* had to sleep?"], { x: 460, y: 40, w: 1000, size: 100 });
const tAge = K.ticket(hud, { x: 50, y: 10, w: 330, label: "AGE", sub: "years", digits: 2 });
const tHours = K.ticket(hud, { x: 1420, y: 10, w: 450, label: "HOURS AWAKE INSTEAD", sub: "while everyone sleeps", digits: 6 });
const tYouH = K.ticket(hud, { x: 50, y: 10, w: 450, label: "YOUR HOURS AWAKE", sub: "age 50, never slept", digits: 6 });
const tMomH = K.ticket(hud, { x: 1420, y: 10, w: 450, label: "MOM'S HOURS AWAKE", sub: "age 75, slept a third", digits: 6 });
const caps = {
  ceiling: K.say(hud, "Eleven hours of ceiling.", { y: 930, size: 64 }),
  notyet: K.say(hud, "Not yet.", { y: 930, size: 64 }),
  company: K.say(hud, "For once, someone else is awake.", { y: 930, size: 60 }),
  disappear: K.say(hud, "Everyone you love disappears.", { y: 930, size: 60 }),
  stay: K.say(hud, "You always do.", { y: 930, size: 64 }),
};
const capT = { ceiling: [G("ceiling"), GE("ceiling") + 0.6], notyet: [GW("notyet", "not"), GE("notyet") + 0.5], company: [G("company"), GE("company") + 0.4],
  disappear: [G("disappear"), GE("disappear") + 0.4], stay: [GW("stay", "always") - 0.4, GE("stay") + 0.8] };
Object.entries(caps).forEach(([k, c]) => c.cues(capT[k][0]));

/* ---------------------------------------------------------------- the shots */
const S = (k, el, kind = "story", enter = "cut", dt = 0) => ({ t: G(k) - (enter === "turn" ? 0.35 : 0.15) + dt, el, kind, enter });
const D = K.director([
  { t: 0, el: wBirth.root, kind: "story" },
  S("age5", wChild.root, "story", "fade"),
  S("kitchen", wKit.root, "story", "cut"),
  S("age10", wClass.root, "story", "fade"),
  S("age16", wSt.root, "story", "fade"),
  S("age30", r1.root, "riso", "turn"),
  S("napkin", r2.root, "riso", "fade"),
  S("age32", wSt.root, "story", "turn"),
  S("married", wPark.root, "story", "fade"),
  S("dayshift", wSt.root, "story", "fade"),
  S("son", wHome.root, "story", "fade"),
  S("age50", wKit.root, "story", "fade"),
  S("cost", wHome.root, "story", "fade"),
  S("age75", wHosp.root, "story", "fade"),
  S("grand", wGrand.root, "story", "fade"),
  S("real", r3.root, "riso", "turn"),
  S("less", r4.root, "riso", "fade"),
  S("ask", r5.root, "riso", "fade"),
]);
D.cues();
const shotStart = (el, n = 1) => D.shots.filter((s) => s.el === el)[n - 1].t;

/* cameras, one per world (world coordinates; long format shows the whole 1920x1080 at z = 1) */
const camBirth = K.keys([[0, { x: 860, y: 520, z: 1.12 }], [G("again"), { x: 820, y: 560, z: 1.2 }], [G("plant"), { x: 860, y: 580, z: 1.28 }], [G("rule"), { x: 960, y: 540, z: 1.0 }], [G("age5"), { x: 960, y: 520, z: 1.04 }]]);
const camChild = K.keys([[G("age5"), { x: 1300, y: 560, z: 1.25 }], [G("ceiling"), { x: 1380, y: 600, z: 1.55 }], [G("kitchen"), { x: 1380, y: 600, z: 1.6 }]]);
const camKit1 = K.keys([[G("kitchen"), { x: 1300, y: 560, z: 1.15 }], [G("dad"), { x: 1450, y: 580, z: 1.25 }], [G("age10"), { x: 1500, y: 600, z: 1.3 }]]);
const camKit2 = K.keys([[G("age50"), { x: 1400, y: 560, z: 1.1 }], [G("blanket"), { x: 1500, y: 600, z: 1.3 }], [G("cost"), { x: 1520, y: 600, z: 1.34 }]]);
const camClass = K.keys([[G("age10"), { x: 960, y: 540, z: 1.02 }], [G("school"), { x: 900, y: 520, z: 1.12 }], [G("notyet"), { x: 960, y: 600, z: 1.25 }], [G("age16"), { x: 960, y: 600, z: 1.28 }]]);
const camSt = K.keys([[G("age16"), { x: 960, y: 540, z: 1.0 }], [G("windows"), { x: 900, y: 480, z: 1.05 }], [G("threeam"), { x: 980, y: 580, z: 1.12 }],
  [G("age32"), { x: 960, y: 560, z: 1.1 }], [G("company"), { x: 1000, y: 580, z: 1.2 }], [G("dayshift"), { x: 960, y: 520, z: 1.05 }], [G("son"), { x: 920, y: 500, z: 1.1 }]]);
const camPark = K.keys([[G("married"), { x: 1225, y: 580, z: 1.15 }], [G("dayshift"), { x: 1225, y: 600, z: 1.25 }]]);
const camHome = K.keys([[G("son"), { x: 760, y: 560, z: 1.25 }], [G("age50"), { x: 800, y: 560, z: 1.3 }], [G("cost"), { x: 1150, y: 560, z: 1.12 }], [G("calls"), { x: 960, y: 520, z: 1.06 }],
  [G("shoulder"), { x: 1250, y: 600, z: 1.25 }], [G("age75"), { x: 1250, y: 600, z: 1.3 }]]);
const camHosp = K.keys([[G("age75"), { x: 1100, y: 560, z: 1.05 }], [G("rest"), { x: 1150, y: 600, z: 1.22 }], [G("stay"), { x: 1050, y: 580, z: 1.3 }], [G("grand"), { x: 1050, y: 580, z: 1.34 }]]);
const camGrand = K.keys([[G("grand"), { x: 1250, y: 560, z: 1.15 }], [G("bookend"), { x: 1150, y: 560, z: 1.25 }], [G("follow"), { x: 960, y: 500, z: 1.4 }], [G("real"), { x: 900, y: 480, z: 1.5 }]]);

/* cues for the story beats */
banner.cues(G("title"), GE("title") + 0.5);
K.cue(G("rule"), "flap"); K.cue(G("rule") + 0.2, "flap");
K.rollCues(G("age30"), GE("age30"), 0, 87600, 2000);
napkin.cues(G("napkin") + 0.4, GE("predict"));
r3T.cues([0, 1, 2, 3, 4].map((i) => G("nobody") + 0.22 * i)); K.rollCues(G("gardner"), G("gardner") + 2.2, 0, 264, 8);
r4T.cues([0, 1, 2, 3, 4, 5].map((i) => G("less") + 0.2 * i)); r4Helix.cues(G("dec2"), GW("dec2", "dec2") - 0.1); r4Bars.cues(GW("dec2", "wake"), GW("dec2", ["six", "6"]));
r5Grid.cues(G("ask") + 0.3, GE("ask") - 0.2); K.cue(G("ask2"), "chime");
K.cue(GW("married", "married"), "chime"); K.cue(GW("blanket", "cover"), "flap"); K.cue(GW("crossing", "exactly"), "stamp");
hosp.beats && hosp.beats(G("age75") - 0.2, G("grand") - 0.2, 64).forEach((b) => K.cue(b, "tick", { soft: 1 }));

/* ---------------------------------------------------------------- seek */
K.finish((t) => {
  const { shot } = D.at(t);
  const el = shot.el, age = ageAt(t);
  updateHair(age);
  const B = bodyFor(age), blink = K.blink(t, 1e9, 1.3);
  const story = shot.kind === "story";

  if (el === wBirth.root) {
    wBirth.camera(camBirth(t));
    const sleepU = ease.inOutSine(seg(t, G("plant"), G("plant") + 1.2));
    const mins = lerp(21 * 60, 30 * 60, ease.inOutSine(seg(t, G("again"), GE("plant"))));
    birth.update(t, { clock: mins, sleeper: 0, books: 2,
      you: { x: lerp(930, 1010, sleepU), sit: sleepU, sleep: sleepU > 0.6, head: lerp(-8, 10, sleepU), look: lerp(-0.8, 0, sleepU), mouth: sleepU > 0.5 ? "smile" : "o", armF: -20 + 10 * Math.sin(t * 2.2) * (1 - sleepU), blink } });
    crib.eyes(true);
    birthNotes.at(t, clamp((t - G("lullaby") - 0.4) / 0.3) * (1 - clamp((t - G("plant") - 0.3) / 0.4)));
  }
  if (el === wChild.root) {
    wChild.camera(camChild(t));
    const mins = lerp(20 * 60, 31 * 60, ease.inOutSine(seg(t, G("age5") + 1.5, GE("ceiling"))));
    child.update(t, { clock: mins, tag: clamp((t - G("ceiling")) / 0.2), tagText: mins > 30 * 60 ? "7:00 A.M." : "", sleeper: 1, sleeperEyes: "open", zs: 0, you: { x: -800 } });
  }
  if (el === wKit.root) {
    const late = t > shotStart(wKit.root, 2) - 0.01;
    wKit.camera((late ? camKit2 : camKit1)(t));
    const dadIn = ease.outCubic(seg(t, G("dad"), G("dad") + 0.9)), dadSit = ease.inOutSine(seg(t, GW("dad", "falls"), GW("dad", "falls") + 0.8));
    const blanketU = ease.outCubic(seg(t, GW("blanket", "cover"), GW("blanket", "cover") + 0.6));
    kit.update(t, { sky: 1, lamp: 1, flame: late ? 0 : clamp((t - GW("dad", "makes")) / 0.3) * (1 - clamp((t - GW("dad", "falls")) / 0.5)), steam: late ? 0 : clamp((t - GW("dad", "makes") - 0.5) / 0.5),
      clock: late ? 23 * 60 + 40 : 4 * 60 + 2, cast: [
        { x: late ? -800 : seats[0].x, y: seatY(0, 0.78), s: 0.78, hs: 1.4, sit: 1, look: dadIn > 0.5 ? 0.5 : -0.2, head: -6, blink },
        { x: late ? -800 : lerp(seats[1].x + 380, seats[1].x, dadIn), y: lerp(930, seatY(1, 1.3), dadSit), s: 1.3, sit: dadSit, sleep: dadSit > 0.6, head: lerp(0, 14, dadSit), lean: 6 * dadSit, blink },
        { x: late ? seats[1].x - 170 : -800, y: 930, ...bodyFor(50, 1.3), look: 0.4, armF: lerp(-9, -40, blanketU), blink },
        { x: late ? seats[1].x : -800, y: seatY(1, 1.3), s: 1.3, sit: 1, sleep: t > GW("blanket", "asleep") - 0.2, head: 12, lean: 5, blink },
      ] });
  }
  if (el === wClass.root) {
    wClass.camera(camClass(t));
    const d = cls.anchors.desks;
    cls.update(t, { sky: 0.1, clock: 10 * 60 + 15, board: "Summer reading list: ✓ ✓ ✓ ✓ ✓ ✓ ✓ ✓", boardU: ease.inOutSine(seg(t, G("age10"), G("school") + 1.2)), cast: [
      { x: d[0].x, y: d[0].y, s: 0.82, hs: 1.28, sit: 1, look: 0.4, blink },
      { x: d[1].x, y: d[1].y, s: 0.82, hs: 1.28, sit: 1, look: -0.3, mouth: t > G("notyet") ? "flat" : "smile", brow: t > G("notyet") ? 8 : 0, blink },
      { x: d[2].x, y: d[2].y, s: 0.82, hs: 1.28, sit: 1, look: -0.5, blink },
      { x: cls.anchors.teacher.feet.x, y: cls.anchors.teacher.feet.y, look: 0.6, armF: t < GE("school") ? -60 : -9, brow: t > G("school") ? 10 : 0, blink },
    ] });
  }
  if (el === wSt.root) {
    wSt.camera(camSt(t));
    const n1 = shotStart(wSt.root, 2), n2 = shotStart(wSt.root, 3);
    const phase = t < n1 ? 0 : t < n2 ? 1 : 2;
    const lights = phase === 0 ? lerp(0.9, 0.08, ease.inOutSine(seg(t, G("windows"), GE("threeam")))) : phase === 1 ? 0.12 : 0.05;
    const noorIn = ease.outCubic(seg(t, GW("meet", "noor") - 0.3, GW("meet", "noor") + 0.6)) * (phase === 1 ? 1 : 0);
    st.update(t, { sky: 1, lights, neon: 1, car: phase === 0 ? seg(t, G("age16") + 1.5, G("age16") + 5) : phase === 2 ? seg(t, G("dayshift"), G("dayshift") + 4) : 0, cast: [
      { x: st.anchors.sidewalk.x, y: st.anchors.sidewalk.y, ...bodyFor(age, 1.05), look: phase === 1 ? 0.5 : 0, blink },
      { x: lerp(st.anchors.sidewalk.x + 520, st.anchors.sidewalk.x + 130, noorIn), y: st.anchors.sidewalk.y, s: noorIn > 0.01 ? 1.02 : 0.001, look: -0.5, blink },
    ] });
  }
  if (el === wPark.root) {
    wPark.camera(camPark(t));
    park.update(t, { sky: lerp(0.45, 0.25, seg(t, G("married"), G("dayshift"))), lamp: 0, cast: [{ ...bodyFor(age, 1.3), look: 0.5, armF: -30, blink }, { look: -0.5, armB: 30, blink }] });
    bunting.setAttribute("transform", `translate(0 ${3 * Math.sin(t * 1.6)})`);
  }
  if (el === wHome.root) {
    wHome.camera(camHome(t));
    const sonOn = t < shotStart(wHome.root, 2);
    homeProps.parentNode.style.opacity = sonOn ? 1 : 0;
    sonCrib.eyes(Math.sin(t * 0.9) > 0.3);
    const mins = lerp(23 * 60, 27 * 60 + 50, ease.inOutSine(seg(t, G("cost"), G("age75"))));
    home.update(t, { clock: sonOn ? 3 * 60 + 12 : mins, sleeper: 1, books: 3,
      you: { x: sonOn ? 870 : 930, ...bodyFor(age), look: sonOn ? -0.8 : t > G("shoulder") ? 0.8 : 0.3, head: sonOn ? -8 : 4, brow: t > G("grow") ? 8 : 0, blink } });
  }
  if (el === wHosp.root) {
    wHosp.camera(camHosp(t));
    const asleep = t > GW("stay", "asleep") - 0.1;
    hosp.update(t, { sky: 1, patient: 1, eyes: asleep ? "closed" : "open", bpm: 64, cast: [{ x: hosp.anchors.chair.x, y: hosp.anchors.chair.y, sit: 1, ...bodyFor(age, 1.3), look: 0.7, head: 6, brow: 6, blink }] });
  }
  if (el === wGrand.root) {
    wGrand.camera(camGrand(t));
    const asleep = t > G("asleep") + 0.6;
    grand.update(t, { clock: 21 * 60 + 30 + 40 * seg(t, G("grand"), G("real")), sleeper: 1, sleeperEyes: asleep ? "closed" : "open", zs: asleep ? 1 : 0, books: 4,
      you: { x: 1110, ...bodyFor(age), look: t > G("follow") ? -0.9 : 0.8, head: t > G("follow") ? -8 : 6, mouth: t > G("bookend") && !asleep ? "o" : "smile", blink } });
    grandNotes.at(t, clamp((t - G("bookend") - 0.3) / 0.3) * (1 - clamp((t - G("asleep") - 0.8) / 0.5)));
  }
  /* riso pages */
  if (el === r1.root) {
    r1.drift(t, G("age30"), G("napkin"));
    const [v] = K.roll(t, G("age30"), GE("age30"), 0, 87600);
    r1Big.at(t, G("age30"), v); r1Unit.at(t, G("age30") + 0.3); r1Eq.at(t, G("age30") + 0.8); r1Ten.at(t, G("tenyears"));
    r1List.forEach((x, i) => x.at(t, G("learn") + 0.9 * i + 0.2));
  }
  if (el === r2.root) {
    r2.drift(t, G("napkin"), G("age32"));
    r2T.at(t, [G("napkin"), G("napkin") + 0.25, G("napkin") + 0.5]); r2Sub.at(t, G("napkin") + 0.6);
    napkin.at(t, G("napkin") + 0.4, GE("predict") - 0.4);
    const ru = ease.outCubic(seg(t, GW("predict", "exactly") - 0.2, GW("predict", "exactly") + 0.3));
    r2Ring.setAttribute("opacity", ru); r2Ring.setAttribute("r", 44 * lerp(1.6, 1, ru)); r2At.at(t, GW("predict", "exactly"));
  }
  if (el === r3.root) {
    r3.drift(t, G("real"), G("less"));
    r3T.at(t, [0, 1, 2, 3, 4].map((i) => G("nobody") + 0.22 * i));
    const [g] = K.roll(t, G("gardner"), G("gardner") + 2.2, 0, 264);
    r3Big.at(t, G("gardner") - 0.2, g); r3Note.at(t, G("gardner") + 2.4); r3Rats.at(t, G("rats"));
  }
  if (el === r4.root) {
    r4.drift(t, G("less"), G("ask"));
    r4T.at(t, [0, 1, 2, 3, 4, 5].map((i) => G("less") + 0.2 * i));
    r4Helix.at(t, G("dec2"), GW("dec2", "dec2") - 0.1); r4Bars.at(t, GW("dec2", "wake"), GW("dec2", ["six", "6"])); r4Animals.at(t, G("animals")); r4Fine.at(t, GW("dec2", "wake"));
  }
  if (el === r5.root) {
    r5.drift(t, G("ask"), T.end);
    const n = r5Grid.at(t, G("ask") - 0.1, G("ask") + 0.3, GE("ask") - 0.2);
    r5Big.at(t, G("ask"), Math.min(26, n), G("ask2")); r5Sub.at(t, G("ask2")); r5Ask.at(t, G("ask2") + 0.6);
  }

  /* HUD */
  banner.at(t, G("title"), GE("title") + 0.5);
  const crossing = el === wKit.root && t > shotStart(wKit.root, 2) - 0.01;
  const showHud = story && t > G("rule") && !crossing ? 1 : 0;
  const dv = (ageAt(t + 1 / 24) - age) * 365 * 8;
  tAge.el.style.visibility = tHours.el.style.visibility = showHud ? "visible" : "hidden";
  tAge.at(t, G("rule"), Math.floor(age) + ease.inOutSine(clamp((age - Math.floor(age) - 0.8) / 0.2)), 0);
  tHours.at(t, G("rule") + 0.2, age * 365 * 8, dv);
  [tYouH, tMomH].forEach((tk) => (tk.el.style.visibility = crossing ? "visible" : "hidden"));
  const [cv, cd] = K.roll(t, G("crossing") - 0.2, GW("crossing", "exactly") + 0.4, 0, 438000);
  tYouH.at(t, crossing ? shotStart(wKit.root, 2) : 1e9, cv, cd);
  tMomH.at(t, crossing ? shotStart(wKit.root, 2) + 0.2 : 1e9, cv, cd);
  Object.entries(caps).forEach(([k, c]) => c.at(t, capT[k][0], capT[k][1]));
}, T.end);
</script>
